services:
  postgres:
    image: postgres:16-alpine
    container_name: trancas_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-trancas_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-trancas_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: trancas_api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__ConexaoPadrao: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-trancas_db};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres}"
      Jwt__ChaveSecreta: "${JWT_SECRET:-ChaveSuperSecretaDesenvolvimentoSaaSDeTrancas20261234567890}"
    ports:
      - "5000:8080"

volumes:
  postgres_data:
